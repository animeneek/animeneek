<title>AnimeNeek</title>

<body>
<header>
  <div class="logo" id="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2.5 5l7 3.2L12 18l2.5-9.8 7-3.2-4.2 9.2L12 20.5l-5.3-6.3z"/></svg><span>AnimeNeek</span></div>
